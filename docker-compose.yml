services:
  abies-v2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abies_v2
    stdin_open: true
    tty: true
    restart: unless-stopped
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "abiesplus-local:host-gateway"
    environment:
      - PLAYWRIGHT_BROWSERS_PATH=/opt/playwright-browsers
      - HEADLESS=true
      - BROWSER_EXTRA_ARGS=--no-sandbox --disable-dev-shm-usage --disable-gpu
      - AUTH_STATE_FILE=/app/state/auth_state.json
      - STATE_FILE=/app/state/v2_state.json
      - LOG_FILE=/app/v2/logs/abies_v2.log
      - V2_DB_PATH=/app/v2/data/v2.sqlite3
      - OUTPUT_DIR=/app/v2/downloads
      - MAPPING_CSV=/app/v2/data/mapeo_descargas.csv
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/v2/data
      - ./logs:/app/v2/logs
      - ./downloads:/app/v2/downloads
      - ./state:/app/state
      - ./debug_gestores:/app/v2/debug_gestores
    command: ["sh", "-c", "python v2/db/init_db.py && sleep infinity"]

  abies-v2-front:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abies_v2_front
    restart: unless-stopped
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "abiesplus-local:host-gateway"
    environment:
      - PLAYWRIGHT_BROWSERS_PATH=/opt/playwright-browsers
      - HEADLESS=true
      - BROWSER_EXTRA_ARGS=--no-sandbox --disable-dev-shm-usage --disable-gpu
      - AUTH_STATE_FILE=/app/state/auth_state.json
      - STATE_FILE=/app/state/v2_state.json
      - LOG_FILE=/app/v2/logs/abies_v2.log
      - V2_DB_PATH=/app/v2/data/v2.sqlite3
      - OUTPUT_DIR=/app/v2/downloads
      - MAPPING_CSV=/app/v2/data/mapeo_descargas.csv
      - V2_FRONT_HOST=0.0.0.0
      - V2_FRONT_PORT=8010
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/v2/data
      - ./logs:/app/v2/logs
      - ./downloads:/app/v2/downloads
      - ./state:/app/state
      - ./debug_gestores:/app/v2/debug_gestores
    command: ["sh", "-c", "python v2/db/init_db.py && python v2/front/app.py"]
